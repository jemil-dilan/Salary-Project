spring:
  application:
    name: salary-validation-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/salary_validation_db}
    username: ${DATABASE_USER:salary_admin}
    password: ${DATABASE_PASSWORD:admin_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

salary:
  confirmation:
    start-day: 25
    end-day: 5
