plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.8.0'
}

group = 'com.salaryvalidation'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir "${buildDir}/generated/src/main/java"
        }
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Liquibase
    implementation 'org.liquibase:liquibase-core'

    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // OpenAPI generated code
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.25'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'jakarta.annotation:jakarta.annotation-api'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'io.rest-assured:json-path'
    testImplementation 'io.rest-assured:xml-path'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = "$rootDir/src/main/resources/api/salary-validation.yaml".toString()
    outputDir = "${buildDir}/generated".toString()
    apiPackage = 'com.salaryvalidation.infrastructure.api'
    invokerPackage = 'com.salaryvalidation.infrastructure'
    modelPackage = 'com.salaryvalidation.infrastructure.api.model'
    configOptions = [
        dateLibrary: 'java21',
        useSpringBoot3: 'true',
        useJakartaEe: 'true',
        interfaceOnly: 'true',
        skipDefaultInterface: 'true',
        useTags: 'true',
        openApiNullable: 'false',
        generateBuilders: 'false',
        useBeanValidation: 'true',
        performBeanValidation: 'true',
        serializableModel: 'false',
        hideGenerationTimestamp: 'true',
        apiFirst: 'false'
    ]
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

tasks.withType(Test) {
    useJUnitPlatform()
}
