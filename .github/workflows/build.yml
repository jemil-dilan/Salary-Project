name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: salary_validation_db
          POSTGRES_USER: salary_admin
          POSTGRES_PASSWORD: admin_password
        options: '--health-cmd "pg_isready -U salary_admin -d salary_validation_db" --health-interval 10s --health-timeout 5s --health-retries 5'

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/salary_validation_db
          DATABASE_USER: salary_admin
          DATABASE_PASSWORD: admin_password

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
